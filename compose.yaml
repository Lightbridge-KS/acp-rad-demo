name: acp-rad-demo

services:
  bridge:
    build:
      context: .
      target: bridge
    init: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AUDIT_DIR: /app/audit
      BRIDGE_PORT: "8787"
      BRIDGE_TRACE: ${BRIDGE_TRACE:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RAD_LOG_LEVEL: ${RAD_LOG_LEVEL:-INFO}
      RAD_MODEL: ${RAD_MODEL:-openai:gpt-5.6-terra}
      RAD_MODEL_BASE_URL: ${RAD_MODEL_BASE_URL:-}
      RAD_MODELS: ${RAD_MODELS:-}
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "127.0.0.1:${BRIDGE_HOST_PORT:-8787}:8787"
    volumes:
      - audit-data:/app/audit

  editor:
    build:
      context: .
      target: editor
    depends_on:
      bridge:
        condition: service_healthy
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8080}:8080"

volumes:
  audit-data:
